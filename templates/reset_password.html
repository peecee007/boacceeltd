{% extends "base.html" %}
{% block title %}{{ tr('重置密码', 'Reset Password') }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <h2>{{ tr('设置新密码', 'Choose a New Password') }}</h2>
      <p>{{ tr('请输入新的登录密码。', 'Enter your new sign-in password.') }}</p>
    </div>
    <div class="auth-body">
      <form method="POST">
        <div class="form-group"><label>{{ tr('新密码', 'New Password') }}</label><input type="password" name="password" required/></div>
        <div class="form-group"><label>{{ tr('确认新密码', 'Confirm New Password') }}</label><input type="password" name="confirm_password" required/></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">{{ tr('更新密码', 'Update Password') }}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

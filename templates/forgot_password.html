{% extends "base.html" %}
{% block title %}{{ tr('忘记密码', 'Forgot Password') }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <h2>{{ tr('密码重置', 'Password Reset') }}</h2>
      <p>{{ tr('输入您的邮箱，我们会发送重置链接。', 'Enter your email and we will send a reset link.') }}</p>
    </div>
    <div class="auth-body">
      <form method="POST">
        <div class="form-group"><label>{{ tr('邮箱地址', 'Email Address') }}</label><input type="email" name="email" required/></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">{{ tr('发送重置链接', 'Send Reset Link') }}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

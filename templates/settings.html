{% extends "base.html" %}
{% block title %}{{ tr('账户设置', 'Account Settings') }}{% endblock %}
{% block content %}
<div class="card" style="margin-top:20px;">
  <div class="section-title">{{ tr('账户偏好设置', 'Account Preferences') }}</div>
  <form method="POST">
    <div class="form-grid">
      <div class="form-group"><label>{{ tr('界面语言', 'Interface Language') }}</label><select name="preferred_lang"><option value="zh" {{ 'selected' if user.preferred_lang == 'zh' }}>中文</option><option value="en" {{ 'selected' if user.preferred_lang == 'en' }}>English</option></select></div>
      <div class="form-group"><label>{{ tr('主币种', 'Primary Currency') }}</label><select name="currency">{% for currency in currencies %}<option value="{{ currency }}" {{ 'selected' if user.currency == currency }}>{{ currency }}</option>{% endfor %}</select></div>
    </div>
    <div class="form-group"><label><input type="checkbox" name="email_notifications_enabled" {% if user.email_notifications_enabled %}checked{% endif %}/> {{ tr('启用邮件通知（欢迎信、登录提醒、交易回执等）', 'Enable email notifications for welcome, login alerts, receipts, and updates') }}</label></div>
    <div class="form-group"><label>{{ tr('每日转账限额（只读）', 'Daily Transfer Limit (read only)') }}</label><input type="text" value="{{ "{:,.2f}".format(user.daily_transfer_limit) }} {{ user.currency }}" readonly/></div>
    <button type="submit" class="btn btn-primary">{{ tr('保存设置', 'Save Settings') }}</button>
  </form>
  <form method="POST" action="{{ url_for('send_test_email') }}" style="margin-top:12px;">
    <button type="submit" class="btn">{{ tr('发送测试邮件', 'Send Test Email') }}</button>
  </form>
</div>
{% endblock %}

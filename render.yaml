services:
  - type: web
    name: boacceeltd
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: boacceeltd-db
          property: connectionString

databases:
  - name: boacceeltd-db
    plan: free

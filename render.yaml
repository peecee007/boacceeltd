version: "1"
services:
  - type: web
    name: boacceeltd
    runtime: docker
    repo: https://github.com/peecee007/boacceeltd
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: boacceeltd-db
          property: connectionString

databases:
  - name: boacceeltd-db
    plan: free
    region: oregon
